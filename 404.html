<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoveType</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E0910">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#0E0910; --text:#F5EEF2; --text2:#A08898; --text3:#6B5060;
    --champagne:#C9A96E; --champagne-lt:#E0C080; --blush:#E8C8D8;
    --bord:rgba(255,220,240,0.09); --surf:rgba(255,240,250,0.055);
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 32px;
  }
  .serif { font-family: 'DM Serif Display', Georgia, serif; }
  .box { max-width: 460px; text-align: center; }
  .mark { width: 44px; height: 44px; margin: 0 auto 26px; }
  h1 { font-size: 30px; letter-spacing: -0.5px; margin-bottom: 12px; color: var(--blush); }
  p { color: var(--text2); font-size: 16px; margin-bottom: 26px; }
  .code {
    display: inline-block; font-family: 'DM Serif Display', Georgia, serif;
    font-size: 26px; letter-spacing: 6px; color: var(--text); padding-left: 6px;
    border: 1px solid var(--bord); border-radius: 12px; padding: 10px 18px 10px 24px;
    background: var(--surf); margin-bottom: 26px;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 14px 24px; border-radius: 13px;
    background: linear-gradient(135deg, var(--champagne-lt), var(--champagne));
    color: #14100A; font-size: 15px; font-weight: 600; text-decoration: none;
  }
  .muted { display: block; margin-top: 22px; font-size: 14px; }
  .muted a { color: var(--text3); }
</style>
</head>
<body>
  <div class="box">
    <svg class="mark" viewBox="0 0 26 26" fill="none" aria-hidden="true">
      <circle cx="13" cy="13" r="11.5" stroke="#C07090" stroke-width="1.1" opacity="0.85"/>
      <circle cx="13" cy="13" r="7.6" stroke="#A080C0" stroke-width="1.1" opacity="0.85"/>
      <circle cx="13" cy="13" r="4" stroke="#7080C0" stroke-width="1.1" opacity="0.85"/>
      <circle cx="13" cy="13" r="1.8" fill="#C9A96E"/>
    </svg>
    <div id="content">
      <h1 class="serif">Page not found</h1>
      <p>That link doesn't lead anywhere. Try the <a href="/" style="color:var(--champagne-lt)">home page</a> or explore <a href="/compatibility" style="color:var(--champagne-lt)">how the styles pair up</a>.</p>
    </div>
  </div>
  <script>
    (function () {
      var m = location.pathname.match(/^\/compare\/([A-Za-z0-9]{2,12})\/?$/);
      if (!m) return;
      var code = m[1].toUpperCase();
      document.getElementById('content').innerHTML =
        '<h1 class="serif">Someone shared their LoveType</h1>' +
        '<p>Open the LoveType app and enter this code to see how your relationship styles fit — where you click, where you grind, and one thing each of you can try.</p>' +
        '<div class="code">' + code + '</div><br>' +
        '<a class="btn" href="https://apps.apple.com/us/app/lovetype-relationship-test/id6786477464">Get LoveType</a>' +
        '<span class="muted"><a href="/">love-type.app</a></span>';
      document.title = 'Compare on LoveType — code ' + code;
    })();
  </script>
</body>
</html>
